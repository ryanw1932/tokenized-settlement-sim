services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 3s
      retries: 20
    ports: ["5432:5432"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ledger
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
